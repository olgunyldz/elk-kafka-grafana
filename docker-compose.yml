# Step 01: 3-node Kafka cluster (KRaft, no ZooKeeper) + topic init
#
# Inside Docker: kafka-1:9092, kafka-2:9092, kafka-3:9092
# From the host: localhost:19092, localhost:29092, localhost:39092
#
# Networks, one per layer:
#   data-layer     brokers + kafka-init           (internal: no route to the outside world)
#   service-layer  brokers + producer, consumer, kafka-ui
# The brokers join both layers, so services reach Kafka through service-layer,
# while controller voting, replication and topic setup stay on data-layer.

x-kafka-common: &kafka-common
  image: apache/kafka:4.0.0
  networks:
    - data-layer
    - service-layer
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

# Key for card and personal data in Kafka messages (AES-256, base64).
# This is the PUBLIC lab key from the repo: anyone with it can decrypt. Override it with
# DATA_ENCRYPTION_KEY in your shell or a .env file (git-ignored) for anything real.
x-pci-env: &pci-env
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-+WpfE866Ysy6Lp51Q61eBAcupVyUtI5nnyxwm6avujc=}

# Spring Boot logging in Docker: one ECS JSON object per line (plain text when run from the IDE),
# so filebeat-apps can ship it to the app-logs topic. service.name comes from spring.application.name.
x-logging-env: &logging-env
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: docker

x-kafka-env: &kafka-env
  # Every node must share the same cluster ID
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  # Each node is both broker and controller
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Cluster-wide defaults for 3 brokers
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 3
  # Topics are created explicitly by kafka-init
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    hostname: kafka-1
    ports:
      - "19092:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:19092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    hostname: kafka-2
    ports:
      - "29092:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:29092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    hostname: kafka-3
    ports:
      - "39092:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:39092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  # One-shot container: creates the topics, then exits
  kafka-init:
    image: apache/kafka:4.0.0
    container_name: kafka-init
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: "no"
    networks:
      - data-layer

  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - service-layer

  # Spring Boot apps (step 02). Built from springboot/, see each module's Dockerfile.
  producer:
    build:
      context: ./springboot
      dockerfile: producer/Dockerfile
    image: elk-kafka-grafana/producer
    container_name: producer
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      <<: [*pci-env, *logging-env]
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SIMULATOR_ENABLED: "false"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - service-layer

  consumer:
    build:
      context: ./springboot
      dockerfile: consumer/Dockerfile
    image: elk-kafka-grafana/consumer
    container_name: consumer
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      <<: [*pci-env, *logging-env]
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - service-layer

  # Ships the apps' own log lines (ECS JSON) from the Docker log files to the app-logs topic.
  # Reads only the producer and consumer containers (see filebeat/filebeat-apps.yml).
  filebeat-apps:
    image: elastic/filebeat:9.5.3
    container_name: filebeat-apps
    user: root                       # to read the Docker socket and the container log files
    command: [ "filebeat", "-e", "--strict.perms=false" ]
    volumes:
      - ./filebeat/filebeat-apps.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat-apps-data:/usr/share/filebeat/data   # remembers how far each log file was read
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    networks:
      - service-layer

volumes:
  filebeat-apps-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

networks:
  data-layer:
    name: data-layer
    internal: true
  service-layer:
    name: service-layer
