# App logs: Kafka -> Elasticsearch (pipeline "app-logs" in pipelines.yml).
# filebeat-apps writes every log line of the producer and consumer to the topic app-logs as one
# JSON document (already parsed: @timestamp, log.level, message, service.name, container.*, ...).
# This pipeline consumes it in group "logstash-app-logs" and indexes it into app-logs-YYYY.MM.dd.
# The apps mask card and personal data before writing (log-masking), so the lines arrive masked.

input {
  kafka {
    bootstrap_servers => "kafka-1:9092"
    topics            => ["app-logs"]
    group_id          => "logstash-app-logs"
    client_id         => "logstash-app-logs"
    auto_offset_reset => "earliest"
    consumer_threads  => 3                # one consumer per partition
    decorate_events   => "basic"
    codec             => json             # Filebeat's event, with @timestamp from the app's log line
  }
}

filter {
  # Where the log line travelled through Kafka (handy to check ordering and lag)
  mutate {
    add_field => {
      "[kafka][topic]"     => "%{[@metadata][kafka][topic]}"
      "[kafka][partition]" => "%{[@metadata][kafka][partition]}"
      "[kafka][offset]"    => "%{[@metadata][kafka][offset]}"
    }
  }
  mutate {
    convert      => { "[kafka][partition]" => "integer" "[kafka][offset]" => "integer" }
    # The json codec keeps the raw JSON in event.original: it would double the size of every log line
    remove_field => [ "[event][original]" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
}
