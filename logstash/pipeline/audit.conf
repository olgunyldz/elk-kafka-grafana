# Audit (regulation) records: Kafka -> archive file + Elasticsearch (pipeline "audit" in pipelines.yml).
# The apps write every audit record to the topic audit-events (acks=all, min.insync.replicas=2), sealed
# into a hash chain: each record carries seq, prevHash and an HMAC over the record and prevHash.
#
#  1. The archive: the record exactly as it came from Kafka, one line per record, appended to
#     /audit-archive/audit-YYYY-MM-DD.jsonl. This is the record of truth; audit-verifier checks its
#     chains every minute. In production this goes to WORM storage (object lock / immutable bucket).
#  2. Elasticsearch audit-YYYY.MM: the same record, parsed, for searching in Kibana. Not the proof:
#     an index can be changed, the archive's chain shows whether it was.
#
# No masking filter here, on purpose: a filter would change the record and break its HMAC. Audit
# records hold no card or personal data in the first place; the AuditLogger rejects such values,
# and the verifier's DLP scan checks audit-* too.

input {
  kafka {
    bootstrap_servers => "kafka-1:9092,kafka-2:9092"
    topics            => ["audit-events"]
    group_id          => "logstash-audit"
    client_id         => "logstash-audit"
    auto_offset_reset => "earliest"       # never skip a record: the chain would show a gap
    consumer_threads  => 3
    decorate_events   => "basic"
    codec             => plain { charset => "UTF-8" }   # keep the exact bytes for the archive
  }
}

filter {
  # The exact line for the archive, before anything is parsed or added
  mutate { copy => { "message" => "[@metadata][raw]" } }

  json {
    source       => "message"
    remove_field => [ "message" ]
    tag_on_failure => [ "_audit_unparseable" ]
  }
  # The record's own time (UTC, millisecond precision) is the event time, not when Logstash read it
  date {
    match  => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  mutate {
    add_field => {
      "[kafka][topic]"     => "%{[@metadata][kafka][topic]}"
      "[kafka][partition]" => "%{[@metadata][kafka][partition]}"
      "[kafka][offset]"    => "%{[@metadata][kafka][offset]}"
    }
    remove_field => [ "event", "@version" ]
  }
  mutate { convert => { "[kafka][partition]" => "integer" "[kafka][offset]" => "integer" } }
}

output {
  # 1. Archive: append the raw line. The day is the record's day (UTC); flush within a second.
  file {
    path           => "/audit-archive/audit-%{+YYYY-MM-dd}.jsonl"
    codec          => line { format => "%{[@metadata][raw]}" }
    flush_interval => 1
    file_mode      => 0640
    dir_mode       => 0750
  }
  # 2. Search copy; the eventId as the document id, so a re-delivered record isn't counted twice
  if "_audit_unparseable" not in [tags] {
    elasticsearch {
      hosts       => ["http://elasticsearch:9200"]
      index       => "audit-%{+YYYY.MM}"
      document_id => "%{eventId}"
      action      => "create"             # never overwrite an indexed audit record
    }
  }
}
