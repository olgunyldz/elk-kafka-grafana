# Kafka messages: Kafka -> Elasticsearch (pipeline "kafka-messages" in pipelines.yml).
# Logstash is just another Kafka consumer, in group "logstash": it reads the message topics and
# indexes every record into Elasticsearch, one index per topic (kafka-messages-<topic>).
#
# Not in the consumer app's decrypt list (pci.decrypt.consumer-groups), and without the key anyway:
# Logstash stores exactly what Kafka holds. Card and personal data stay encrypted tokens
# (pan:v1:1111:...), and their readable hints make them searchable without the key.

input {
  kafka {
    bootstrap_servers => "kafka-1:9092,kafka-2:9092"
    topics            => ["app-events", "app-log-messages", "app-metrics"]
    group_id          => "logstash"
    client_id         => "logstash"
    auto_offset_reset => "earliest"      # a new group starts from the beginning of the topics
    consumer_threads  => 3               # one consumer per partition
    decorate_events   => "extended"      # topic, partition, offset, key, timestamp and headers in [@metadata][kafka]
    codec             => plain
  }
}

filter {
  # Where the message came from
  mutate {
    add_field => {
      "[kafka][topic]"          => "%{[@metadata][kafka][topic]}"
      "[kafka][partition]"      => "%{[@metadata][kafka][partition]}"
      "[kafka][offset]"         => "%{[@metadata][kafka][offset]}"
      "[kafka][consumer_group]" => "%{[@metadata][kafka][consumer_group]}"
    }
  }
  if [@metadata][kafka][key] {
    mutate { add_field => { "[kafka][key]" => "%{[@metadata][kafka][key]}" } }
  }
  # The producer's message type (log, event, metric) and whether the PCI protection encrypted something
  if [@metadata][kafka][headers][__TypeId__] {
    mutate { add_field => { "[kafka][type]" => "%{[@metadata][kafka][headers][__TypeId__]}" } }
  }
  if [@metadata][kafka][headers][pci-protected] {
    mutate { add_field => { "[kafka][pci_protected]" => "true" } }
  } else {
    mutate { add_field => { "[kafka][pci_protected]" => "false" } }
  }
  mutate {
    convert => {
      "[kafka][partition]"     => "integer"
      "[kafka][offset]"        => "integer"
      "[kafka][pci_protected]" => "boolean"
    }
    # event.original repeats "message" word for word: drop it to keep the index small
    remove_field => [ "[event][original]" ]
  }

  # @timestamp = when the producer sent the message (Kafka record timestamp), not when Logstash read it
  date {
    match  => ["[@metadata][kafka][timestamp]", "UNIX_MS"]
    target => "@timestamp"
  }

  # JSON values become searchable fields under "payload"; plain text stays in "message"
  if [message] =~ /^\s*\{/ {
    json {
      source               => "message"
      target               => "payload"
      skip_on_invalid_json => true
    }
  }

  # Layer 3: mask card and personal data before it is stored. Messages from PciKafkaTemplate are already
  # protected (tokens stay as they are); this catches any producer that writes without it.
  ruby {
    path          => "/usr/share/logstash/pipeline/shared/mask_sensitive.rb"
    script_params => { "fields" => ["message", "[payload]"] }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "kafka-messages-%{[kafka][topic]}"
  }
}
