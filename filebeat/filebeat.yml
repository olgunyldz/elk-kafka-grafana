# Filebeat for every container except the microservices: straight to Elasticsearch, without Kafka.
#   kafka-1, kafka-init, kafka-ui, monitoring containers   --> infra-logs-YYYY.MM.dd  ("Infra logs" data view)
#   elasticsearch, logstash, kibana, kibana-setup          --> elk-logs-YYYY.MM.dd    ("All logs" adds these)
#   (monitoring: kafka-exporter, blackbox-exporter, cadvisor, prometheus, grafana, tempo, jmx-exporter-download)
# The broker's logs must not depend on Kafka being healthy, so this path skips Kafka.
# Left out: the microservices (their logs go through Kafka, see filebeat-apps.yml) and the Filebeats themselves.

filebeat.autodiscover:
  providers:
    - type: docker
      templates:
        # 1. Kafka: Java log lines start with "[2026-10-30 ...]"; a stack trace is joined to its line
        - condition:
            or:
              - equals.docker.container.name: kafka-1
              - equals.docker.container.name: kafka-init
          config:
            - type: filestream
              id: "kafka-${data.docker.container.id}"
              paths: [ "/var/lib/docker/containers/${data.docker.container.id}/*.log" ]
              prospector.scanner.symlinks: true
              parsers:
                - container: ~
                - multiline:
                    type: pattern
                    pattern: '^\['
                    negate: true
                    match: after

        # 2. Every other container of this Compose project, except Kafka (above), the microservices
        #    and the Filebeats
        - condition:
            and:
              - has_fields: [ "docker.container.labels.com.docker.compose.service" ]
              - not:
                  or:
                    - equals.docker.container.labels.com.docker.compose.service: producer
                    - equals.docker.container.labels.com.docker.compose.service: consumer
                    - equals.docker.container.labels.com.docker.compose.service: message-api
                    - equals.docker.container.name: kafka-1
                    - equals.docker.container.name: kafka-init
                    - equals.docker.container.name: filebeat
                    - equals.docker.container.name: filebeat-apps
          config:
            - type: filestream
              id: "other-${data.docker.container.id}"
              paths: [ "/var/lib/docker/containers/${data.docker.container.id}/*.log" ]
              prospector.scanner.symlinks: true
              parsers:
                - container: ~

processors:
  - copy_fields:
      fields:
        - from: docker.container.labels.com_docker_compose_service   # the Compose service
          to: service.compose
      fail_on_error: false
      ignore_missing: true

  # ---- Masking of card and personal data (layer 2 of 3; keep in sync with filebeat.yml / filebeat-apps.yml) ----
  # The apps already mask with the log-masking library (layer 1); this catches what slips through, also in
  # the logs of other services. Go regexps (RE2) have no lookbehind and no checksums, so these patterns are
  # stricter than the library's and can mask a harmless number too. Logstash (layer 3) checks checksums.
  # Replacements use $1, not ${1}: Filebeat would read ${...} as an environment variable.
  - replace:
      ignore_missing: true
      fail_on_error: false
      fields:
        # values of sensitive keys: password=..., "cvv":"123", Authorization: Bearer ..., tckn=...
        - field: message
          pattern: '(?i)(["'']?\b(?:password|passwd|pwd|secret|client[_-]?secret|token|access[_-]?token|refresh[_-]?token|id[_-]?token|api[_-]?key|apikey|authorization|cvv2?|cvc2?|cid|security[_-]?code|pin|pin[_-]?block|tckn|tc[_-]?kimlik[_-]?no|national[_-]?id)\b["'']?\s*[:=]\s*["'']?)(?:(?:Bearer|Basic)\s+)?[^"''\s,;&}\[\]]*[^"''\s,;&}\[\].]'
          replacement: '$1***'
        # values of personal keys (names, birth date, address), spaces included, up to the next delimiter
        - field: message
          pattern: '(?i)(["'']?\b(?:first[_-]?name|last[_-]?name|full[_-]?name|surname|customer[_-]?name|holder[_-]?name|cardholder(?:[_-]?name)?|name[_-]?on[_-]?card|birth[_-]?date|date[_-]?of[_-]?birth|dob|address|street(?:[_-]?address)?|address[_-]?line[12]|city|postal[_-]?code|zip)\b["'']?\s*[:=]\s*["'']?)[^"'',;&{}\[\]\r\n*][^"'',;&{}\[\]\r\n]*'
          replacement: '$1***'
        # card expiry after a key: expiry=12/27
        - field: message
          pattern: '(?i)(\bexp(?:iry|iration)?(?:[_-]?date)?["'']?\s*[:=]\s*["'']?)\d{1,2}\s*/\s*\d{2,4}'
          replacement: '$1**/**'
        # IBAN: country code and last 4 stay
        - field: message
          pattern: '\b([A-Z]{2})\d{2}(?: ?[A-Z0-9]{4}){2,6} ?[A-Z0-9]{0,3}([A-Z0-9]{4})\b'
          replacement: '$1********************$2'
        # card number (13-19 digits, network digit 2-6, spaces/dashes allowed): last 4 stay
        - field: message
          pattern: '\b[2-6](?:\d[ -]?){8,14}(\d{4})\b'
          replacement: '************$1'
        # Turkish national ID: 11 digits, first not 0; without a checksum this also masks other 11-digit numbers
        - field: message
          pattern: '\b[1-9]\d{8}(\d{2})\b'
          replacement: '*********$1'
        # email: first character and domain stay; the local part is masked even if the domain is cut off
        - field: message
          pattern: '(^|[^A-Za-z0-9._%+-])([A-Za-z0-9._%+-])[A-Za-z0-9._%+-]*@([A-Za-z0-9-])'
          replacement: '$1$2***@$3'
        # international phone: last 2 stay
        - field: message
          pattern: '\+\d(?:[ ().-]?\d){7,12}[ ().-]?(\d{2})\b'
          replacement: '+**********$1'
        # Turkish mobile 05xx xxx xx xx: last 2 stay
        - field: message
          pattern: '\b0?5\d{2}[ -]?\d{3}[ -]?\d{2}[ -]?(\d{2})\b'
          replacement: '*********$1'

# Daily indices, next to app-logs-YYYY.MM.dd, instead of Filebeat's default filebeat-<version> data stream.
# Kafka and monitoring go to infra-logs-*, everything else (the ELK stack) to elk-logs-*.
output.elasticsearch:
  hosts: [ "http://elasticsearch:9200" ]
  index: "elk-logs-%{+yyyy.MM.dd}"
  indices:
    - index: "infra-logs-%{+yyyy.MM.dd}"
      when.or:
        - equals.container.name: kafka-1
        - equals.container.name: kafka-init
        - equals.container.name: kafka-ui
        - equals.container.name: kafka-exporter
        - equals.container.name: blackbox-exporter
        - equals.container.name: prometheus
        - equals.container.name: grafana
        - equals.container.name: jmx-exporter-download
        - equals.container.name: cadvisor
        - equals.container.name: tempo

# Plain indices: no Filebeat template or ILM policy; Elasticsearch maps the fields dynamically
setup.template.enabled: false
setup.ilm.enabled: false

http.enabled: true
http.host: 0.0.0.0
http.port: 5066

logging.level: info
