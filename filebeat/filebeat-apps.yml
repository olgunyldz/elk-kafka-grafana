# Filebeat for the Spring Boot apps: their own log lines go to Kafka.
#   producer, consumer (ECS JSON on stdout) --> Docker log files --> filebeat-apps --> topic app-logs
# Kafka is the buffer: if Logstash or Elasticsearch is down, logs wait in the topic and are indexed later.
# The apps already mask card and personal data before writing (log-masking library), so nothing
# sensitive reaches these files or Kafka.

filebeat.autodiscover:
  providers:
    - type: docker
      templates:
        - condition:
            or:
              - equals.docker.container.name: producer
              - equals.docker.container.name: consumer
          config:
            - type: filestream
              id: "app-${data.docker.container.id}"
              paths: [ "/var/lib/docker/containers/${data.docker.container.id}/*.log" ]
              prospector.scanner.symlinks: true
              parsers:
                - container: ~           # unwrap Docker's JSON log line
                - ndjson:                # then the app's own ECS JSON (LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs)
                    target: ""
                    overwrite_keys: true
                    expand_keys: true
                    add_error_key: true

processors:
  - copy_fields:
      fields:
        - from: container.name     # container_name = Compose service name in this project
          to: service.compose
      fail_on_error: false
      ignore_missing: true

# Each event is written to Kafka as one JSON document
output.kafka:
  hosts: [ "kafka-1:9092" ]
  topic: app-logs
  # Key = the container, so each app's log lines land in one partition and keep their order
  key: '%{[container.name]}'
  partition.hash:
    reachable_only: false
  required_acks: -1          # acks=all: written to all in-sync replicas (here: the one broker) before Filebeat moves on
  compression: gzip
  max_message_bytes: 1000000

# Status API: curl http://localhost:5066/stats from inside the container
http.enabled: true
http.host: 0.0.0.0
http.port: 5066

logging.level: info
