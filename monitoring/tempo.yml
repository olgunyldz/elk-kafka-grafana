# Grafana Tempo: stores the apps' traces. Single binary, local disk, lab-sized.
#   producer, consumer --OTLP/HTTP :4318--> tempo --> Grafana (Explore → Tempo, http://localhost:3000)
# The metrics generator turns spans into Prometheus metrics (service graph, span rates and durations),
# written to Prometheus with remote write: that's what draws the service map in Grafana.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m          # write blocks often: traces become searchable from disk quickly

compactor:
  compaction:
    block_retention: 24h          # keep traces for a day

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      # service-graphs: who calls whom (producer → Kafka → consumer); span-metrics: rate, errors, duration;
      # local-blocks: TraceQL metrics queries in Grafana
      processors: [service-graphs, span-metrics, local-blocks]
