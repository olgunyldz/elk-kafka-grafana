server:
  port: 8082

spring:
  application:
    name: consumer
  kafka:
    # Host-side listener of the broker. Inside Docker: kafka-1:9092
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      # A new group starts from the oldest record still in the topic
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps the JSON deserializer: a record that isn't valid JSON goes to the error handler instead of failing the poll loop
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # Same type ids as the producer, mapped to this service's own classes
        spring.json.type.mapping: "log:io.github.olgunyldz.consumer.model.LogMessage,event:io.github.olgunyldz.consumer.model.AppEvent,metric:io.github.olgunyldz.consumer.model.MetricMessage"
        spring.json.trusted.packages: io.github.olgunyldz.consumer.model

app:
  kafka:
    topics:
      # LogMessage records from POST /api/logs. app-logs holds the apps' own log lines (Filebeat)
      logs: app-log-messages
      events: app-events
      metrics: app-metrics

pci:
  # Same key as the producer. The default is the PUBLIC lab key: real environments must set DATA_ENCRYPTION_KEY.
  data-encryption-key: ${DATA_ENCRYPTION_KEY:+WpfE866Ysy6Lp51Q61eBAcupVyUtI5nnyxwm6avujc=}
  decrypt:
    # Only these consumer groups get plaintext (* = every group). Other readers of the topics
    # (kafka-ui, Logstash later) see tokens such as pan:v1:1111:...
    consumer-groups: log-consumer,event-consumer,metric-consumer

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  # Plain text by default (IDE, mvn spring-boot:run). Docker sets LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
  # for one ECS JSON object per line, which Filebeat ships to the app-logs topic.
  masking:
    enabled: true
    disabled-rules: ""
    extra-sensitive-keys: ""
    extra-personal-keys: ""     # e.g. mother_maiden_name (values may contain spaces)
  level:
    org.apache.kafka: warn
