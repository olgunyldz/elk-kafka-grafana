server:
  port: 8082

spring:
  application:
    name: consumer
  # Timeouts for the RestClient calls to message-api: a slow API must not stall the listener threads
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 3s
  kafka:
    listener:
      # Observation: a span per record, continuing the producer's trace from the traceparent header
      observation-enabled: true
    # Host-side listeners of the brokers. Inside Docker: kafka-1:9092,kafka-2:9092
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092,localhost:29092}
    consumer:
      # A new group starts from the oldest record still in the topic
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps the JSON deserializer: a record that isn't valid JSON goes to the error handler instead of failing the poll loop
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # Same type ids as the producer, mapped to this service's own classes
        spring.json.type.mapping: "log:io.github.olgunyldz.consumer.model.LogMessage,event:io.github.olgunyldz.consumer.model.AppEvent,metric:io.github.olgunyldz.consumer.model.MetricMessage"
        spring.json.trusted.packages: io.github.olgunyldz.consumer.model

app:
  # Called for every record a listener handled (consumer → message-api), see MessageApiClient
  message-api:
    url: ${MESSAGE_API_URL:http://localhost:8084}
  kafka:
    topics:
      # LogMessage records from POST /api/logs. app-logs holds the apps' own log lines (Filebeat)
      logs: app-log-messages
      events: app-events
      metrics: app-metrics

pci:
  # Same key as the producer. The default is the PUBLIC lab key: real environments must set DATA_ENCRYPTION_KEY.
  data-encryption-key: ${DATA_ENCRYPTION_KEY:+WpfE866Ysy6Lp51Q61eBAcupVyUtI5nnyxwm6avujc=}
  decrypt:
    # Only these consumer groups get plaintext (* = every group). Other readers of the topics
    # (kafka-ui, Logstash later) see tokens such as pan:v1:1111:...
    consumer-groups: log-consumer,event-consumer,metric-consumer

audit:
  # Regulatory audit log (separate from the application logs): hash-chained records to the audit-events topic
  enabled: true
  # HMAC key for the hash chain: its own secret, not the data encryption key. The default is the PUBLIC lab
  # key: real environments must set AUDIT_HMAC_KEY (from a KMS / Vault).
  hmac-key: ${AUDIT_HMAC_KEY:Vb8x2lXQ7Hn3yQm1q0bC9kRzT5uW4eA6sD2fG8hJ1kM=}
  key-id: audit-v1
  heartbeat-interval: 60s

management:
  endpoints:
    web:
      exposure:
        # prometheus: scraped by Prometheus every 5 s (monitoring/prometheus.yml)
        include: health,info,prometheus
  metrics:
    tags:
      # Every metric carries application="producer" / "consumer": the Grafana dashboards filter on it
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0            # trace every request (lab); the default is 0.1
  opentelemetry:
    tracing:
      export:
        otlp:
          # Tempo's OTLP/HTTP receiver. Inside Docker: http://tempo:4318/v1/traces
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  # Only traces go over OTLP: metrics go to Prometheus, logs through Filebeat
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

logging:
  # Plain text by default (IDE, mvn spring-boot:run). Docker sets LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
  # for one ECS JSON object per line, which Filebeat ships to the app-logs topic.
  masking:
    enabled: true
    disabled-rules: ""
    extra-sensitive-keys: ""
    extra-personal-keys: ""     # e.g. mother_maiden_name (values may contain spaces)
  level:
    org.apache.kafka: warn
