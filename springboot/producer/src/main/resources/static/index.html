<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafka Producer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #dfe3e8;
    --text: #1d2329;
    --muted: #66707a;
    --accent: #2f6fde;
    --accent-text: #ffffff;
    --ok: #1f8a4c;
    --err: #c8372d;
    --code-bg: #f1f3f6;
    --bar-bg: #e7eaee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --panel: #1b1e22;
      --border: #2d3238;
      --text: #e4e7ea;
      --muted: #949ca5;
      --accent: #5b8ff0;
      --accent-text: #0d1117;
      --ok: #4cc283;
      --err: #f0736a;
      --code-bg: #15181b;
      --bar-bg: #2a2f35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .status { font-size: 13px; color: var(--muted); }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
  .status.up .dot { background: var(--ok); }
  .status.down .dot { background: var(--err); }

  .grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }

  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  select, input[type=number], textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
  }
  textarea {
    font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    background: var(--code-bg);
    min-height: 230px;
    resize: vertical;
  }
  textarea.invalid { border-color: var(--err); }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > .field { flex: 1 1 140px; }
  .label-row { display: flex; justify-content: space-between; align-items: baseline; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 16px; }

  button {
    font: inherit;
    font-weight: 600;
    border-radius: 6px;
    padding: 9px 16px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.link { border: none; background: none; padding: 0; color: var(--accent); font-size: 13px; font-weight: 500; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; }
  .error-text { color: var(--err); font-size: 13px; margin-top: 6px; min-height: 1.5em; }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .stat .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat.ok .v { color: var(--ok); }
  .stat.err .v { color: var(--err); }
  .progress { height: 6px; background: var(--bar-bg); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }

  .partitions { margin-bottom: 18px; }
  .prow { display: grid; grid-template-columns: 90px 1fr 50px; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 6px; }
  .prow .bar { height: 10px; background: var(--bar-bg); border-radius: 5px; overflow: hidden; }
  .prow .bar > div { height: 100%; background: var(--accent); }
  .prow .n { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 13px; }

  .log { max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; }
  td.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  td.ok { color: var(--ok); }
  td.err { color: var(--err); white-space: normal; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kafka Producer</h1>
    <span id="status" class="status"><span class="dot"></span>Loading topics…</span>
  </header>

  <div class="grid">
    <section class="panel">
      <h2>Message</h2>

      <div class="field">
        <label for="topic">Topic</label>
        <select id="topic" disabled></select>
      </div>

      <div class="field">
        <div class="label-row">
          <label for="payload">Request body <span class="hint" id="endpoint"></span></label>
          <button type="button" class="link" id="newSample">New sample</button>
        </div>
        <textarea id="payload" spellcheck="false"></textarea>
        <div class="error-text" id="payloadError"></div>
      </div>

      <div class="row">
        <div class="field">
          <label for="count">Number of requests</label>
          <input id="count" type="number" min="1" max="10000" value="10">
        </div>
        <div class="field">
          <label for="parallel">In parallel <span class="hint">(at once)</span></label>
          <input id="parallel" type="number" min="1" max="50" value="5">
        </div>
      </div>

      <label class="check">
        <input type="checkbox" id="randomize" checked>
        New random data for each request
      </label>

      <div class="actions">
        <button class="primary" id="send" disabled>Send</button>
        <button id="stop" disabled>Stop</button>
      </div>
    </section>

    <section class="panel">
      <h2>Results</h2>

      <div class="stats">
        <div class="stat"><div class="v" id="sSent">0</div><div class="k">sent</div></div>
        <div class="stat ok"><div class="v" id="sOk">0</div><div class="k">acknowledged</div></div>
        <div class="stat err"><div class="v" id="sErr">0</div><div class="k">failed</div></div>
        <div class="stat"><div class="v" id="sRate">–</div><div class="k">req / s</div></div>
      </div>
      <div class="progress"><div id="progress"></div></div>

      <h2>Records per partition</h2>
      <div class="partitions" id="partitions"><div class="empty">Nothing sent yet.</div></div>

      <h2>Latest responses</h2>
      <div class="log">
        <table>
          <thead><tr><th>#</th><th>Status</th><th>Topic-partition@offset</th><th>Time</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const int = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

// Sample data for each message type. The type comes from GET /api/topics.
const samples = {
  log: () => {
    const roll = Math.random();
    const level = roll < .6 ? "INFO" : roll < .75 ? "DEBUG" : roll < .9 ? "WARN" : "ERROR";
    const messages = {
      INFO: ["Order created", "User logged in", "Payment authorized", "Cart updated"],
      DEBUG: ["Cache hit for product list", "Loaded user profile", "Retrying downstream call"],
      WARN: ["Slow query took 1200 ms", "Inventory low for SKU-" + int(100, 999), "Retry 2 of 3"],
      ERROR: ["Payment gateway timeout", "Database connection refused", "NullPointerException in CheckoutService"],
    };
    return {
      service: pick(["order-service", "payment-service", "user-service", "inventory-service", "shipping-service"]),
      level,
      message: pick(messages[level]),
    };
  },
  event: () => ({
    type: pick(["OrderPlaced", "OrderPaid", "OrderShipped", "OrderCancelled"]),
    aggregateId: "order-" + int(1, 50),
    payload: {
      customerId: "customer-" + int(1, 20),
      amount: int(10, 500) + int(0, 99) / 100,
      currency: pick(["EUR", "USD", "TRY"]),
      items: int(1, 5),
    },
  }),
  metric: () => {
    const name = pick(["http_requests_total", "http_response_time_ms", "cpu_usage_percent", "memory_used_mb"]);
    const value = {
      http_requests_total: int(1, 200),
      http_response_time_ms: int(5, 1500),
      cpu_usage_percent: int(1, 100),
      memory_used_mb: int(128, 2048),
    }[name];
    return {
      service: pick(["order-service", "payment-service", "user-service", "inventory-service", "shipping-service"]),
      name,
      value,
      tags: { instance: "pod-" + int(1, 3), region: pick(["eu-west", "us-east"]) },
    };
  },
};

let topics = [];
let running = false;
let stopRequested = false;

function current() {
  return topics.find((t) => t.name === $("topic").value);
}

function fillSample() {
  const t = current();
  if (!t) return;
  $("payload").value = JSON.stringify(samples[t.type](), null, 2);
  $("endpoint").textContent = "POST " + t.endpoint;
  validatePayload();
}

function validatePayload() {
  try {
    JSON.parse($("payload").value);
    $("payload").classList.remove("invalid");
    $("payloadError").textContent = "";
    return true;
  } catch (e) {
    $("payload").classList.add("invalid");
    $("payloadError").textContent = "Not valid JSON: " + e.message;
    return false;
  }
}

function setStatus(text, state) {
  const el = $("status");
  el.className = "status " + (state || "");
  el.innerHTML = '<span class="dot"></span>' + text;
}

async function loadTopics() {
  try {
    const res = await fetch("/api/topics");
    if (!res.ok) throw new Error("HTTP " + res.status);
    topics = await res.json();
    $("topic").innerHTML = topics.map((t) => `<option value="${t.name}">${t.name}</option>`).join("");
    $("topic").disabled = false;
    $("send").disabled = false;
    fillSample();
    setStatus("Producer is up · " + topics.length + " topics", "up");
  } catch (e) {
    setStatus("Can't reach the producer: " + e.message, "down");
  }
}

// ---- Results ----
const stats = { sent: 0, ok: 0, err: 0, partitions: {}, started: 0 };
let rowCount = 0;

function resetResults() {
  Object.assign(stats, { sent: 0, ok: 0, err: 0, partitions: {}, started: performance.now() });
  rowCount = 0;
  $("rows").innerHTML = "";
  renderStats(0);
  renderPartitions();
}

function renderStats(total) {
  $("sSent").textContent = stats.sent;
  $("sOk").textContent = stats.ok;
  $("sErr").textContent = stats.err;
  const seconds = (performance.now() - stats.started) / 1000;
  $("sRate").textContent = stats.sent && seconds > 0 ? (stats.sent / seconds).toFixed(1) : "–";
  $("progress").style.width = total ? (100 * stats.sent / total) + "%" : "0";
}

function renderPartitions() {
  const entries = Object.entries(stats.partitions).sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }));
  if (!entries.length) {
    $("partitions").innerHTML = '<div class="empty">Nothing sent yet.</div>';
    return;
  }
  const max = Math.max(...entries.map(([, n]) => n));
  $("partitions").innerHTML = entries.map(([p, n]) => `
    <div class="prow">
      <span>partition ${p.split("-").pop()}</span>
      <div class="bar"><div style="width:${100 * n / max}%"></div></div>
      <span class="n">${n}</span>
    </div>`).join("");
}

function addRow(n, ok, detail, ms) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td>${n}</td>
    <td class="${ok ? "ok" : "err"}">${ok ? "202" : "error"}</td>
    <td class="${ok ? "mono" : "err"}"></td>
    <td>${ms} ms</td>`;
  tr.children[2].textContent = detail;
  $("rows").prepend(tr);
  // Keep the table short
  if (++rowCount > 100) $("rows").lastElementChild.remove();
}

// ---- Sending ----
async function sendOne(n, topic, body) {
  const t0 = performance.now();
  try {
    const res = await fetch(topic.endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const ms = Math.round(performance.now() - t0);
    if (!res.ok) {
      const text = await res.text();
      let reason = "HTTP " + res.status;
      try { reason += " " + (JSON.parse(text).error || ""); } catch (_) {}
      stats.err++;
      addRow(n, false, reason, ms);
      return;
    }
    const r = await res.json();
    stats.ok++;
    const key = r.topic + "-" + r.partition;
    stats.partitions[key] = (stats.partitions[key] || 0) + 1;
    addRow(n, true, `${r.topic}-${r.partition}@${r.offset}`, ms);
  } catch (e) {
    stats.err++;
    addRow(n, false, e.message, Math.round(performance.now() - t0));
  }
}

async function run() {
  if (!$("randomize").checked && !validatePayload()) return;
  const topic = current();
  const total = Math.min(Math.max(parseInt($("count").value, 10) || 1, 1), 10000);
  const parallel = Math.min(Math.max(parseInt($("parallel").value, 10) || 1, 1), 50);
  $("count").value = total;
  $("parallel").value = parallel;
  const fixedBody = $("randomize").checked ? null : JSON.parse($("payload").value);

  running = true;
  stopRequested = false;
  setControls();
  resetResults();

  let next = 1;
  const worker = async () => {
    while (!stopRequested && next <= total) {
      const n = next++;
      const body = fixedBody ?? samples[topic.type]();
      stats.sent++;
      await sendOne(n, topic, body);
      renderStats(total);
      renderPartitions();
    }
  };
  await Promise.all(Array.from({ length: Math.min(parallel, total) }, worker));

  running = false;
  setControls();
  renderStats(total);
}

function setControls() {
  $("send").disabled = running;
  $("stop").disabled = !running;
  $("topic").disabled = running;
  $("send").textContent = running ? "Sending…" : "Send";
}

$("topic").addEventListener("change", fillSample);
$("newSample").addEventListener("click", fillSample);
$("payload").addEventListener("input", validatePayload);
$("send").addEventListener("click", run);
$("stop").addEventListener("click", () => { stopRequested = true; });

loadTopics();
</script>
</body>
</html>
